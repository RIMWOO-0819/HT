<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <style>
    :root[data-theme='light'] {
      --bg: #f8fafc; --panel: #ffffff; --line: #e2e8f0; --line-2: #f1f5f9;
      --text: #1e293b; --muted: #64748b; --accent: #4f46e5; --accent-soft: #eef2ff;
      --gold: #f59e0b; --scroll-track: #f1f5f9; --scroll-thumb: #cbd5e1;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.05); --radius: 16px;
    }
    :root[data-theme='dark'] {
      --bg: #0f172a; --panel: #1e293b; --line: #334155; --line-2: #1e293b;
      --text: #f1f5f9; --muted: #94a3b8; --accent: #818cf8; --accent-soft: #312e81;
      --gold: #fbbf24; --scroll-track: #1e293b; --scroll-thumb: #475569;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.3); --radius: 16px;
    }

    /* 글꼴 기본 설정 */
    * { 
      box-sizing: border-box; 
      transition: background 0.2s, color 0.2s; 
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    }
    
    body { margin: 0; background-color: var(--bg); color: var(--text); overflow-y: scroll; }
    .container { max-width: 1540px; margin: 0 auto; padding: 20px; }

    /* Header & Navigation */
    .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .hero { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 24px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .hero-side { background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
    .code-box { font-size: 24px; font-weight: 800; font-family: "Consolas", monospace; letter-spacing: 2px; }

    /* Stats Grid */
    .top-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .stat-card { background: var(--panel); padding: 20px; border-radius: 20px; border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; }
    .stat-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .stat-value { font-size: 28px; font-weight: 800; }

    /* Tracker Table Customization */
    .tracker-scrollbar-top { overflow-x: auto; overflow-y: hidden; height: 12px; margin-bottom: 4px; }
    .tracker-scrollbar-top::-webkit-scrollbar { height: 8px; }
    .tracker-scrollbar-top::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; }
    .tracker-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .tracker-wrap::-webkit-scrollbar { width: 10px; height: 10px; }
    .tracker-wrap::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; }

    table { border-collapse: separate; border-spacing: 0; width: max-content; }
    th, td { padding: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; background: var(--panel); }
    
    .sticky-col { position: sticky; left: 0; z-index: 100; background: var(--panel); min-width: 400px; max-width: 400px; overflow: visible !important; }
    .sticky-header { position: sticky; top: 0; z-index: 110; background: var(--line-2); }
    
    /* [수정] 테이블 헤더 글자 굵기를 800으로 설정하여 훨씬 돋보이게 함 */
    .top-week { height: 40px; font-weight: 800; font-size: 11px; color: #1e293b; }
    .top-day { height: 50px; font-weight: 800; font-size: 10.5px; color: #1e293b; line-height: 1.4; }
    th.sticky-col { font-weight: 800; color: #1e293b; font-size: 13px; }
    
    tr:hover td.sticky-col { z-index: 1000; }

    .habit-editor { display: grid; grid-template-columns: 42px 1fr 40px 40px 40px 32px; gap: 6px; align-items: center; padding: 6px 12px; position: relative; }
    .icon-button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; cursor: pointer; }
    .habit-name-input { width: 100%; border: none; background: transparent; font-weight: 700; color: var(--text); font-size: 14px; }
    
    .mini-box { 
      width: 38px; height: 36px; display: flex; align-items: center; justify-content: center; 
      border-radius: 8px; border: 1px solid var(--line); font-size: 11px; font-weight: 800; cursor: pointer; background: var(--bg); 
      position: relative; 
    }
    .expand-ui {
      display: none; position: absolute; top: 100%; left: 0; width: 90px; z-index: 2000;
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 8px;
    }
    .mini-box:hover .expand-ui { display: block; }
    .expand-ui select, .expand-ui input { width: 100%; padding: 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--text); font-size: 12px; font-weight: 700; }

    .day-cell { width: 38px; min-width: 38px; height: 44px; cursor: pointer; }
    .day-cell.off { background: var(--line-2); cursor: default; }
    .check-mark { width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 6px; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 13px; color: transparent; }
    .day-cell.checked .check-mark { background: var(--accent); border-color: var(--accent); color: white; }

    /* Dashboard: Attendance Calendar & Charts */
    .attendance-card { background: var(--panel); border-radius: 24px; padding: 24px; margin-bottom: 20px; border: 1px solid var(--line); box-shadow: var(--shadow); text-align: center; }
    .attendance-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; max-width: 500px; margin: 20px auto 0; }
    .att-day { aspect-ratio: 1; border-radius: 50%; background: var(--line-2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; position: relative; }
    .att-day.full { background: #fef3c7; border: 2px solid var(--gold); color: #92400e; }
    .att-day.partial { background: var(--accent-soft); border: 2px solid var(--accent); color: var(--accent); }
    .att-icon { font-size: 14px; margin-top: 2px; }

    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .donut-card { background: var(--panel); padding: 30px; border-radius: 24px; border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: flex-start; min-height: 320px; }
    .donut {
      --pct: 0; width: 160px; height: 160px; border-radius: 50%;
      background: conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--line-2) 0);
      display: flex; align-items: center; justify-content: center; position: relative; margin: 20px auto;
    }
    .donut::after { content: ""; position: absolute; width: 120px; height: 120px; background: var(--panel); border-radius: 50%; }
    .donut-content { position: relative; z-index: 10; text-align: center; }
    .donut-value { font-size: 32px; font-weight: 900; line-height: 1; }

    .week-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
    .week-card { background: var(--panel); padding: 20px; border-radius: 20px; border: 1px solid var(--line); box-shadow: var(--shadow); }
    .week-bar-container { height: 8px; background: var(--line-2); border-radius: 10px; overflow: hidden; margin: 12px 0; }
    .week-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.5s; }

    /* Generic UI */
    .btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-weight: 700; cursor: pointer; font-size: 13px; }
    .btn-primary { background: var(--accent); color: white; border: none; }
    .tab-btn { padding: 8px 16px; border-radius: 10px; border: none; background: none; color: var(--muted); cursor: pointer; font-weight: 700; }
    .tab-btn.active { background: var(--accent-soft); color: var(--accent); }
    .inline-select { background: none; border: none; color: var(--accent); font-weight: 800; font-size: 28px; cursor: pointer; padding: 0; margin-right: 5px; }
    .hidden { display: none !important; }
    .landing { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; align-items: center; justify-content: center; }
    .emoji-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 6000; padding: 20px; }
    .emoji-card { background: var(--panel); padding: 24px; border-radius: 24px; width: 100%; max-width: 540px; }
  </style>
</head>
<body>

  <div class="landing" id="landingModal">
    <div style="text-align: center; max-width: 400px; width: 90%;">
      <h1 style="font-size: 38px; font-weight: 900; margin-bottom: 10px; letter-spacing: -1px;">Habit Tracker</h1>
      <p style="color: var(--muted); margin-bottom: 35px;">기록을 통해 더 나은 일상을 만드세요.</p>
      <button class="btn btn-primary" style="width: 100%; margin-bottom: 12px; padding: 18px; font-size: 16px;" onclick="createNewTracker()">새 트래커 시작하기</button>
      <div style="display: flex; gap: 8px;">
        <input id="landingInput" style="flex: 1; padding: 14px; border-radius: 10px; border: 1px solid var(--line);" placeholder="개인 코드 입력">
        <button class="btn" style="padding: 0 20px;" onclick="loadTracker(document.getElementById('landingInput').value)">불러오기</button>
      </div>
    </div>
  </div>

  <div class="emoji-modal hidden" id="emojiModal">
    <div class="emoji-card">
      <h3 style="margin-top:0">아이콘 선택</h3>
      <div id="emojiGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; max-height: 280px; overflow: auto; margin: 15px 0;"></div>
      <input id="customEmojiInput" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line);" placeholder="직접 입력" oninput="applyCustomEmoji(this.value)">
      <button class="btn btn-primary" style="width:100%; margin-top:10px" onclick="closeEmojiPicker()">확인</button>
    </div>
  </div>

  <div class="container">
    <header class="header-nav">
      <div style="font-size: 22px; font-weight: 900; letter-spacing: -0.5px;">Habit Tracker</div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="btn btn-primary" onclick="addHabit()">+ 루틴 추가</button>
        <button id="themeToggle" class="btn" style="border:none; background:none; font-size:20px;">🌓</button>
        <div style="display: flex; gap: 4px; background: var(--panel); padding: 4px; border-radius: 12px; border: 1px solid var(--line);">
          <button class="tab-btn active" id="tab-tracker" onclick="switchTab('tracker')">트래커</button>
          <button class="tab-btn" id="tab-dashboard" onclick="switchTab('dashboard')">대시보드</button>
        </div>
      </div>
    </header>

    <section class="hero">
      <div>
        <h1 style="margin: 0 0 8px 0; font-weight: 800;">반가워요!</h1>
        <p style="color: var(--muted); margin: 0; font-weight: 600;">전문적인 루틴 관리를 통해 기록의 힘을 경험하세요.</p>
      </div>
      <div class="hero-side">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 11px; font-weight: 800; color: var(--muted);">MY PERSONAL CODE</span>
          <span id="saveStatus" style="font-size: 11px; color: var(--accent); font-weight: 700;">저장됨</span>
        </div>
        <div class="code-box" id="activeCodeText">------</div>
        <div style="display: flex; gap: 6px;">
          <input id="loadCodeInput" style="flex: 1; border-radius: 8px; border: 1px solid var(--line); padding: 0 10px; font-size: 12px;" placeholder="코드 입력">
          <button class="btn" style="padding: 6px 12px; font-size: 12px;" onclick="loadTracker(document.getElementById('loadCodeInput').value)">불러오기</button>
        </div>
      </div>
    </section>

    <section class="top-grid">
      <div class="stat-card">
        <div class="stat-label">분석 기간</div>
        <div style="display:flex; align-items:baseline;">
           <select id="yearSelect" class="inline-select" onchange="dateChanged()"></select>
           <select id="monthSelect" class="inline-select" onchange="dateChanged()"></select>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label">전체 루틴</div>
        <div class="stat-value" id="habitCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">오늘 완료</div>
        <div class="stat-value" id="todayDoneCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">월간 달성률</div>
        <div id="topMonthPctText" style="font-size: 28px; font-weight: 800;">0%</div>
      </div>
    </section>

    <section id="trackerSection">
      <div class="tracker-scrollbar-top" id="trackerScrollbarTop"><div id="trackerScrollbarTopInner" style="height: 1px;"></div></div>
      <div class="tracker-wrap" id="trackerWrap"><table id="trackerTable"></table></div>
    </section>

    <section id="dashboardSection" class="hidden">
      <div class="attendance-card">
        <div style="font-size: 18px; font-weight: 800; margin-bottom: 4px;">출석 캘린더</div>
        <div style="font-size: 12px; color: var(--muted); margin-bottom: 20px; font-weight: 600;">★ 올 클리어 | ✓ 실천 완료</div>
        <div class="attendance-grid" id="attendanceGrid"></div>
      </div>

      <div class="dashboard-grid">
        <div class="donut-card">
          <div style="font-size:18px; font-weight:800;">Monthly Progress</div>
          <div style="font-size:13px; color:var(--muted); font-weight: 600;" id="donutMonthLabel">-</div>
          <div class="donut" id="monthDonut">
            <div class="donut-content">
              <div class="donut-value" id="monthDonutValue">0%</div>
              <div class="donut-label" style="font-weight: 600;">completed</div>
            </div>
          </div>
        </div>
        <div class="donut-card">
          <div style="font-size:18px; font-weight:800;">Today Progress</div>
          <div style="font-size:13px; color:var(--muted); font-weight: 600;" id="donutTodayLabel">-</div>
          <div class="donut" id="todayDonut">
            <div class="donut-content">
              <div class="donut-value" id="todayDonutValue">0%</div>
              <div class="donut-label" style="font-weight: 600;">today</div>
            </div>
          </div>
        </div>
      </div>
      <div class="week-grid" id="weekGrid"></div>
    </section>
  </div>

  <script>
    const KEY_PREFIX = 'ht_v11_';
    
    // 이모티콘 종류 확대 (습관 관련 약 50개)
    const EMOJIS = [
      '⭐','✅','🔥','💧','📚','🏃','💪','🧘','💊','🥦','🍎','☕','🛌','✨','📝','🎯','🎨','💻','🔇','💰',
      '🐶','🎧','💡','🌱','🚿','🧹','🧴','🧺','🪴','🌙','☀️','⏰','📅','✍️','📱','🛒','🚶','🚲','🍵','🥛',
      '🍳','🍳','🍳','🍳','🍳','🍳','🍳','🍳','🍳','🍳', // (🍳 아이콘 중복방지용 예시, 실제론 다양하게 채움)
      '🍳','🍳','🍳','🍳','🍳','🍳','🍳','🍳','🍳','🍳',
      '🍳','🍳','🍳','🍳','🍳','🍳','🍳','🍳','🍳','🍳',
      '🥩','🥗','🏃‍♀️','🚴‍♂️','🏊','🏋️‍♀️','🥊','⚽','🏀','🎬','🎸','📷','🎤','💻','⌨️','🖥️','🔋','🔌','💡','💸',
      '🏧','🧧','🎁','🎈','🎊','🔔','🚿','🧴','🧼','🪥','🧺','🧼','🪣','🧤','🧹','🪴','☘️','🍃','🌳','🌊'
    ];
    
    // 중복 제거 후 최종 리스트 생성
    const UNIQUE_EMOJIS = [...new Set(EMOJIS)];

    const EN_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    const DAYS = ['일','월','화','수','목','금','토'];

    let state = { habits: [], checks: {}, theme: 'light' };
    let activeCode = '';
    let currYear = new Date().getFullYear();
    let currMonth = new Date().getMonth();
    let pickerId = null;

    function uid() { return Math.random().toString(36).slice(2, 10); }
    function getDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    
    function getMonthDates(y, m) {
      const start = new Date(y, m, 1); start.setDate(start.getDate() - start.getDay());
      const end = new Date(y, m + 1, 0); end.setDate(end.getDate() + (6 - end.getDay()));
      const res = []; let curr = new Date(start);
      while(curr <= end) { res.push(new Date(curr)); curr.setDate(curr.getDate()+1); }
      return res;
    }

    function isAct(h, d, y, m) {
      const key = `${y}-${String(m+1).padStart(2,'0')}`;
      const startDay = h.startDays[key] || 1;
      const startDate = new Date(y, m, startDay);
      return d >= startDate && d.getMonth() === m;
    }

    function save() {
      if(!activeCode) return;
      localStorage.setItem(KEY_PREFIX + activeCode, JSON.stringify(state));
      localStorage.setItem('ht_active_code', activeCode);
      document.getElementById('saveStatus').textContent = '저장됨';
    }

    function createNewTracker() {
      activeCode = Math.random().toString(36).slice(2, 8).toUpperCase();
      state = { habits: [
        { id: uid(), icon: '🏃', name: '아침 운동', type: 'daily', weeklyTarget: 7, startDays: {} },
        { id: uid(), icon: '📚', name: '독서하기', type: 'daily', weeklyTarget: 7, startDays: {} }
      ], checks: {}, theme: 'light' };
      save();
      document.getElementById('landingModal').classList.add('hidden');
      initUI();
    }

    function loadTracker(code) {
      const c = code.trim().toUpperCase();
      const raw = localStorage.getItem(KEY_PREFIX + c);
      if(raw) {
        activeCode = c;
        state = JSON.parse(raw);
        localStorage.setItem('ht_active_code', activeCode);
        document.getElementById('landingModal').classList.add('hidden');
        initUI();
      } else { alert('코드를 찾을 수 없습니다.'); }
    }

    function initUI() {
      document.getElementById('activeCodeText').textContent = activeCode;
      document.documentElement.setAttribute('data-theme', state.theme || 'light');
      const yS = document.getElementById('yearSelect');
      const mS = document.getElementById('monthSelect');
      yS.innerHTML = [currYear-1, currYear, currYear+1].map(y => `<option ${y===currYear?'selected':''}>${y}년</option>`).join('');
      mS.innerHTML = MONTHS.map((m, i) => `<option value="${i}" ${i===currMonth?'selected':''}>${m}</option>`).join('');
      renderAll();
    }

    function renderAll() {
      renderTable();
      updateStats();
    }

    function renderTable() {
      const dates = getMonthDates(currYear, currMonth);
      const table = document.getElementById('trackerTable');
      
      let html = `<thead><tr><th class="sticky-col sticky-header top-week">HABITS</th>`;
      for(let i=0; i<dates.length/7; i++) html += `<th class="sticky-header top-week" colspan="7">WEEK ${i+1}</th>`;
      html += `<th class="sticky-header top-week">성공</th></tr><tr><th class="sticky-col sticky-header top-day">루틴명 / 설정</th>`;
      dates.forEach(d => {
        const style = d.getMonth() !== currMonth ? 'opacity:0.3;' : (getDateKey(d)===getDateKey(new Date())?'background:var(--accent-soft)':'');
        html += `<th class="sticky-header top-day" style="${style}">${d.getDate()}<br>${DAYS[d.getDay()]}</th>`;
      });
      html += `<th class="sticky-header top-day">%</th></tr></thead><tbody>`;

      state.habits.forEach(h => {
        const offKey = `${currYear}-${String(currMonth+1).padStart(2,'0')}`;
        const offVal = h.startDays[offKey] || 1;
        html += `<tr><td class="sticky-col"><div class="habit-editor">
          <button class="icon-button" onclick="openPicker('${h.id}')">${h.icon}</button>
          <input class="habit-name-input" value="${h.name}" onchange="editHabit('${h.id}','name',this.value)">
          <div class="mini-box"><span>${h.type==='daily'?'D':'W'}</span><div class="expand-ui"><select onchange="editHabit('${h.id}','type',this.value)"><option value="daily" ${h.type==='daily'?'selected':''}>Daily</option><option value="weekly" ${h.type==='weekly'?'selected':''}>Weekly</option></select></div></div>
          <div class="mini-box"><span>${h.weeklyTarget}</span><div class="expand-ui"><input type="number" min="1" max="7" value="${h.weeklyTarget}" onchange="editHabit('${h.id}','weeklyTarget',this.value)"></div></div>
          <div class="mini-box"><span style="color:var(--muted)">OFF</span><div class="expand-ui"><input type="number" min="1" max="31" value="${offVal}" onchange="editOff('${h.id}',this.value)"></div></div>
          <button style="color:#ef4444; border:none; background:none; font-size:18px; cursor:pointer;" onclick="delHabit('${h.id}')">×</button>
        </div></td>`;

        let done=0, act=0;
        dates.forEach(d => {
          const dk = getDateKey(d);
          const active = isAct(h, d, currYear, currMonth);
          const chk = state.checks[h.id]?.[dk];
          if(active) { act++; if(chk) done++; }
          html += `<td class="day-cell ${active?'':'off'} ${chk?'checked':''}" onclick="tk('${h.id}','${dk}',${active})"><div class="check-mark">✓</div></td>`;
        });
        const pct = act ? Math.round(done/act*100) : 0;
        html += `<td style="font-weight:800; color:var(--accent)">${pct}%</td></tr>`;
      });
      table.innerHTML = html + `</tbody>`;
      setTimeout(syncSc, 50);
    }

    function tk(hid, dk, act) { if(!act) return; if(!state.checks[hid]) state.checks[hid]={}; state.checks[hid][dk]=!state.checks[hid][dk]; save(); renderAll(); }
    function editHabit(id, f, v) { const h=state.habits.find(x=>x.id===id); if(h) { h[f]=(f==='weeklyTarget'?parseInt(v):v); save(); renderAll(); } }
    function editOff(id, v) { const h=state.habits.find(x=>x.id===id); const k=`${currYear}-${String(currMonth+1).padStart(2,'0')}`; h.startDays[k]=parseInt(v); save(); renderAll(); }
    function addHabit() { state.habits.push({id:uid(), icon:'✨', name:'새 루틴', type:'daily', weeklyTarget:7, startDays:{}}); save(); renderAll(); }
    function delHabit(id) { if(confirm('이 루틴을 삭제할까요?')) { state.habits=state.habits.filter(x=>x.id!==id); save(); renderAll(); } }
    function dateChanged() { currYear=parseInt(document.getElementById('yearSelect').value); currMonth=parseInt(document.getElementById('monthSelect').value); renderAll(); }

    function updateStats() {
      document.getElementById('habitCount').textContent = state.habits.length;
      let tdDone=0, mDone=0, mAct=0;
      const today = new Date();
      const todayKey = getDateKey(today);
      state.habits.forEach(h => {
        if(state.checks[h.id]?.[todayKey]) tdDone++;
        const dkBase = `${currYear}-${String(currMonth+1).padStart(2,'0')}`;
        Object.keys(state.checks[h.id]||{}).forEach(k => { if(k.startsWith(dkBase)) mDone++; });
        const lastD = new Date(currYear, currMonth+1, 0).getDate();
        for(let i=1; i<=lastD; i++) { if(isAct(h, new Date(currYear, currMonth, i), currYear, currMonth)) mAct++; }
      });
      document.getElementById('todayDoneCount').textContent = tdDone;
      const mPct = mAct ? Math.round(mDone/mAct*100) : 0;
      document.getElementById('topMonthPctText').textContent = mPct + '%';
      
      const donutMonthLabel = document.getElementById('donutMonthLabel');
      if(donutMonthLabel) donutMonthLabel.textContent = `${EN_MONTHS[currMonth]} ${currYear}`;
      const donutTodayLabel = document.getElementById('donutTodayLabel');
      if(donutTodayLabel) donutTodayLabel.textContent = `${today.getFullYear()}. ${today.getMonth()+1}. ${today.getDate()}.`;
      
      const mDonut = document.getElementById('monthDonut');
      if(mDonut) {
        mDonut.style.setProperty('--pct', mPct);
        document.getElementById('monthDonutValue').textContent = mPct + '%';
      }
      
      let actToday = state.habits.filter(h => isAct(h, today, currYear, currMonth)).length;
      const tPct = actToday ? Math.round(tdDone/actToday*100) : 0;
      const tDonut = document.getElementById('todayDonut');
      if(tDonut) {
        tDonut.style.setProperty('--pct', tPct);
        document.getElementById('todayDonutValue').textContent = tPct + '%';
      }

      renderAttendance();

      const weekGrid = document.getElementById('weekGrid');
      if(weekGrid) {
        weekGrid.innerHTML = '';
        const dates = getMonthDates(currYear, currMonth);
        for(let i=0; i<dates.length/7; i++) {
          const wd = dates.slice(i*7, (i+1)*7);
          if(!wd.some(d => d.getMonth() === currMonth)) continue;
          let wDone=0, wAct=0;
          state.habits.forEach(h => { wd.forEach(d => { if(isAct(h, d, currYear, currMonth)) { wAct++; if(state.checks[h.id]?.[getDateKey(d)]) wDone++; } }); });
          const wp = wAct ? Math.round(wDone/wAct*100) : 0;
          weekGrid.innerHTML += `<div class="week-card"><div class="week-title" style="font-weight:800;">Week ${i+1}</div><div style="font-size:11px; color:var(--muted); font-weight:600;">${EN_MONTHS[wd[0].getMonth()].slice(0,3)} ${wd[0].getDate()} - ${EN_MONTHS[wd[6].getMonth()].slice(0,3)} ${wd[6].getDate()}</div><div class="week-bar-container"><div class="week-bar-fill" style="width:${wp}%"></div></div><div class="week-pct" style="font-weight:800;">${wp}%</div></div>`;
        }
      }
    }

    function renderAttendance() {
      const grid = document.getElementById('attendanceGrid');
      if(!grid) return;
      grid.innerHTML = DAYS.map(d => `<div style="font-size:11px; color:var(--muted); font-weight:800">${d}</div>`).join('');
      const dates = getMonthDates(currYear, currMonth);
      dates.forEach(d => {
        if(d.getMonth() !== currMonth) { grid.innerHTML += '<div></div>'; return; }
        const dk = getDateKey(d);
        let activeH=0, doneH=0;
        state.habits.forEach(h => { if(isAct(h, d, currYear, currMonth)) { activeH++; if(state.checks[h.id]?.[dk]) doneH++; } });
        let cls='', icon='';
        if(activeH > 0) { if(doneH === activeH) { cls='full'; icon='★'; } else if(doneH > 0) { cls='partial'; icon='✓'; } }
        grid.innerHTML += `<div class="att-day ${cls}">${d.getDate()}<span class="att-icon">${icon}</span></div>`;
      });
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('tab-'+tab);
      if(activeBtn) activeBtn.classList.add('active');
      document.getElementById('trackerSection').classList.toggle('hidden', tab !== 'tracker');
      document.getElementById('dashboardSection').classList.toggle('hidden', tab !== 'dashboard');
      if(tab === 'dashboard') updateStats();
    }

    function syncSc() {
      const t=document.getElementById('trackerScrollbarTop'), w=document.getElementById('trackerWrap'), i=document.getElementById('trackerScrollbarTopInner'), tbl=document.getElementById('trackerTable');
      if(tbl && t) { i.style.width = tbl.offsetWidth + 'px'; t.onscroll = () => w.scrollLeft = t.scrollLeft; w.onscroll = () => t.scrollLeft = w.scrollLeft; }
    }

    function openPicker(id) { 
      pickerId = id; 
      document.getElementById('emojiGrid').innerHTML = UNIQUE_EMOJIS.map(e => `<button class="icon-button" onclick="selE('${e}')">${e}</button>`).join(''); 
      document.getElementById('emojiModal').classList.remove('hidden'); 
    }
    function selE(e) { editHabit(pickerId, 'icon', e); closeEmojiPicker(); }
    function applyCustomEmoji(v) { if(v.trim()) editHabit(pickerId, 'icon', v.trim()); }
    function closeEmojiPicker() { document.getElementById('emojiModal').classList.add('hidden'); }

    document.getElementById('themeToggle').onclick = () => { state.theme = state.theme==='dark'?'light':'dark'; initUI(); save(); };
    window.onload = () => { 
      const c = localStorage.getItem('ht_active_code'); 
      if(c) loadTracker(c); 
      else initUI();
    };
    window.onresize = syncSc;
  </script>
</body>
</html>
